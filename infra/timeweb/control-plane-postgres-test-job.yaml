apiVersion: batch/v1
kind: Job
metadata:
  name: iteration-5-control-plane-postgres-tests-9fb0b2d
  namespace: ai-native-paas-system
  labels:
    ai-native-paas.io/owner: verification
    ai-native-paas.io/revision: 9fb0b2d
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iteration-5-control-plane-postgres-tests
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: craas-ai-native-paas-registry
      containers:
        - name: tests
          image: ai-native-paas-registry.registry.twcstorage.ru/ai-native-paas-tests@sha256:8bc27372b398a0d421045f4006b48bbd7afd19177b24a2511ef63f1f09ebdc36
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-ec"]
          args:
            - >-
              export TEST_POSTGRES_DSN="host=${PGHOST} port=${PGPORT} user=${PGUSER}
              password=${PGPASSWORD} dbname=${PGDATABASE} sslmode=${PGSSLMODE}";
              make test-postgres
          envFrom:
            - secretRef:
                name: control-plane-postgres
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
