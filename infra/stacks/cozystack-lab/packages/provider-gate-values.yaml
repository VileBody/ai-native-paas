# Cozystack v1.5.0 provider gate. Only PostgreSQL, Redis, bucket/S3 and their
# lightweight CRD/operator dependencies are added to the smoke package surface.
# The full tenant, Velero and monitoring application stacks remain disabled for
# cheap provider lifecycle windows.
bundles:
  system:
    enabled: true
    variant: isp-full
  iaas:
    enabled: true
  paas:
    enabled: true
  naas:
    enabled: false
  enabledPackages: []
  disabledPackages:
    - cozystack.capi-operator
    - cozystack.capi-provider-bootstrap-kubeadm
    - cozystack.capi-provider-core
    - cozystack.capi-provider-cp-kamaji
    - cozystack.capi-provider-infra-kubevirt
    - cozystack.backupstrategy-controller
    - cozystack.clickhouse-application
    - cozystack.clickhouse-operator
    - cozystack.cozystack-basics
    - cozystack.etcd-application
    - cozystack.etcd-operator
    - cozystack.foundationdb-application
    - cozystack.foundationdb-operator
    - cozystack.goldpinger
    - cozystack.gpu-operator
    - cozystack.grafana-operator
    - cozystack.hami
    - cozystack.harbor-application
    - cozystack.info-application
    - cozystack.kafka-application
    - cozystack.kafka-operator
    - cozystack.kamaji
    - cozystack.kubernetes-application
    - cozystack.kubevirt
    - cozystack.kubevirt-cdi
    - cozystack.mariadb-application
    - cozystack.mariadb-operator
    - cozystack.metrics-server
    - cozystack.mongodb-application
    - cozystack.mongodb-operator
    - cozystack.monitoring-agents
    - cozystack.monitoring-application
    - cozystack.nats-application
    - cozystack.openbao-application
    - cozystack.opensearch-application
    - cozystack.opensearch-operator
    - cozystack.qdrant-application
    - cozystack.rabbitmq-application
    - cozystack.rabbitmq-operator
    - cozystack.tenant-application
    - cozystack.velero
    - cozystack.virtualprivatecloud-application
    - cozystack.vm-default-images
    - cozystack.vm-disk-application
    - cozystack.vm-instance-application
    - cozystack.vertical-pod-autoscaler

publishing:
  host: cozystack.internal
  exposedServices: []
  proxyProtocol: false
  certificates:
    issuerName: letsencrypt-stage

authentication:
  oidc:
    enabled: false
