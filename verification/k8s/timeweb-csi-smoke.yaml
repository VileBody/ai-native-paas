apiVersion: v1
kind: Namespace
metadata:
  name: ai-native-paas-csi-smoke
  labels:
    ai-native-paas.io/owner: verification
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nvme-smoke
  namespace: ai-native-paas-csi-smoke
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: nvme.network-drives.csi.timeweb.cloud
---
apiVersion: v1
kind: Pod
metadata:
  name: csi-writer
  namespace: ai-native-paas-csi-smoke
spec:
  restartPolicy: Never
  nodeSelector:
    ai-native-paas.io/pool: system
  tolerations:
    - key: ai-native-paas.io/system
      operator: Equal
      value: "true"
      effect: NoSchedule
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    runAsGroup: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: writer
      image: busybox:1.36.1@sha256:73aaf090f3d85aa34ee199857f03fa3a95c8ede2ffd4cc2cdb5b94e566b11662
      command: ["/bin/sh", "-ec"]
      args:
        - printf 'ai-native-paas-csi-v1' > /data/sentinel && sync && sleep 3600
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        readOnlyRootFilesystem: true
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: nvme-smoke
