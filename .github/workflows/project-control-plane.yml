name: project-control-plane

on:
  push:
    paths:
      - 'cmd/project-api/**'
      - 'internal/project/**'
      - 'internal/infrastructure/**'
      - 'internal/identity/**'
      - 'internal/agent/enrollment/**'
      - 'internal/source/**'
      - 'internal/workspace/**'
      - 'config/rate-cards/**'
      - 'pkg/contracts/agent/v2/**'
      - 'pkg/contracts/commerce/v2/**'
      - 'pkg/contracts/infrastructure/v1/**'
      - 'pkg/contracts/project/v2/**'
      - 'pkg/contracts/workspace/v1/**'
      - 'test/integration/postgres_enrollment_test.go'
      - 'test/integration/postgres_identity_test.go'
      - 'test/integration/postgres_infrastructure_test.go'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/project-control-plane.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make fmt-check
      - run: go vet ./cmd/project-api ./internal/project/... ./internal/infrastructure/... ./internal/identity/... ./internal/agent/enrollment/... ./internal/source/... ./internal/workspace/... ./pkg/contracts/agent/v2 ./pkg/contracts/commerce/v2 ./pkg/contracts/infrastructure/v1 ./pkg/contracts/project/v2 ./pkg/contracts/workspace/v1
      - run: go test -count=1 ./internal/project/... ./internal/infrastructure/... ./internal/identity/... ./internal/agent/enrollment/... ./internal/source/... ./internal/workspace/... ./pkg/contracts/agent/v2 ./pkg/contracts/commerce/v2 ./pkg/contracts/infrastructure/v1 ./pkg/contracts/project/v2 ./pkg/contracts/workspace/v1

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:9cbd488d3dcffbaf057f994444c92c07901a6bda67799b6712160e813fcdff23
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=paas_test sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: go test -count=1 -tags=postgres_integration ./test/integration -run 'TestPostgres_(AgentEnrollment|Infrastructure|OIDCSubject|Workspace)'

  image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [verify, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.TWC_REGISTRY_HOST }}
          username: ${{ secrets.TWC_REGISTRY_USERNAME }}
          password: ${{ secrets.TWC_REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cmd/project-api/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/vilebody/ai-native-paas-project-api:${{ github.sha }}
            ${{ secrets.TWC_REGISTRY_HOST }}/ai-native-paas-project-api:${{ github.sha }}
