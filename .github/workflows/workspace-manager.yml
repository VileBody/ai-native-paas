name: workspace-manager

on:
  push:
    paths:
      - 'cmd/workspace-manager/**'
      - 'internal/workspace/**'
      - 'pkg/contracts/workspace/v1/**'
      - 'test/integration/postgres_workspace_test.go'
      - 'test/architecture/workspace_execution_boundary_test.go'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/workspace-manager.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make fmt-check
      - run: go vet ./cmd/workspace-manager ./internal/workspace/... ./pkg/contracts/workspace/v1
      - run: go test -race -count=1 ./internal/workspace/... ./pkg/contracts/workspace/v1 ./test/architecture
      - run: go build -trimpath ./cmd/workspace-manager

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=paas_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev pkg-config postgresql-client
      - run: go test -race -count=1 -tags=postgres_integration ./test/integration -run '^TestPostgres_Workspace' -v

  image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [verify, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ secrets.TWC_REGISTRY_HOST }}
          username: ${{ secrets.TWC_REGISTRY_USERNAME }}
          password: ${{ secrets.TWC_REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: cmd/workspace-manager/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/vilebody/ai-native-paas-workspace-manager:${{ github.sha }}
            ${{ secrets.TWC_REGISTRY_HOST }}/ai-native-paas-workspace-manager:${{ github.sha }}
