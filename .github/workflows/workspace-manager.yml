name: workspace-manager

on:
  push:
    paths:
      - 'cmd/workspace-manager/**'
      - 'internal/workspace/**'
      - 'internal/infrastructure/**'
      - 'pkg/contracts/infrastructure/v1/**'
      - 'pkg/contracts/workspace/v1/**'
      - 'test/integration/postgres_workspace_test.go'
      - 'test/integration/postgres_infrastructure_test.go'
      - 'test/architecture/workspace_execution_boundary_test.go'
      - 'go.mod'
      - 'go.sum'
      - '.dockerignore'
      - '.github/workflows/workspace-manager.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make fmt-check
      - run: go vet ./cmd/workspace-manager ./internal/infrastructure/... ./internal/workspace/... ./pkg/contracts/infrastructure/v1 ./pkg/contracts/workspace/v1
      - run: go test -race -count=1 ./internal/infrastructure/... ./internal/workspace/... ./pkg/contracts/infrastructure/v1 ./pkg/contracts/workspace/v1 ./test/architecture
      - run: go build -trimpath ./cmd/workspace-manager

  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17@sha256:0af65001d05296a2ead57ac4a6412433d8913d1bb5d0c88435a7d1e1ee5cb04b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=paas_test sslmode=disable
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev pkg-config postgresql-client
      - run: go test -race -count=1 -tags=postgres_integration ./test/integration -run '^TestPostgres_(Infrastructure|Workspace)' -v

  image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [verify, postgres]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.TWC_REGISTRY_HOST }}
          username: ${{ secrets.TWC_REGISTRY_USERNAME }}
          password: ${{ secrets.TWC_REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cmd/workspace-manager/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ secrets.TWC_REGISTRY_HOST }}/ai-native-paas-workspace-manager:${{ github.sha }}
