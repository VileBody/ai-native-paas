name: workspace-agent

on:
  push:
    paths:
      - 'cmd/workspace-agent/**'
      - 'internal/workspaceagent/**'
      - 'internal/workspace/bootstrap/**'
      - 'internal/workspace/session/**'
      - 'pkg/contracts/workspace/v1/**'
      - 'infra/images/workspace/**'
      - 'scripts/build-workspace-image.sh'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/workspace-agent.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make fmt-check
      - run: go vet ./cmd/workspace-agent ./internal/workspaceagent ./internal/workspace/session/... ./internal/workspace/bootstrap ./pkg/contracts/workspace/v1
      - run: go test -race -count=1 ./internal/workspaceagent ./internal/workspace/session/... ./internal/workspace/bootstrap ./pkg/contracts/workspace/v1 ./test/architecture
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath ./cmd/workspace-agent
      - run: bash -n scripts/build-workspace-image.sh
      - run: jq -e '.schema == "ai-native-paas.io/workspace-image-inputs/v1" and (.tools | length) == 7' infra/images/workspace/images.lock.json

  agent-image:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ secrets.TWC_REGISTRY_HOST }}
          username: ${{ secrets.TWC_REGISTRY_USERNAME }}
          password: ${{ secrets.TWC_REGISTRY_TOKEN }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: cmd/workspace-agent/Dockerfile
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ secrets.TWC_REGISTRY_HOST }}/ai-native-paas-workspace-agent:${{ github.sha }}

  vm-image:
    if: github.event_name == 'workflow_dispatch'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libguestfs-tools qemu-utils xz-utils jq unzip
      - name: Verify libguestfs appliance
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          sudo chmod 0644 /boot/vmlinuz-*
          libguestfs-test-tool
      - run: ./scripts/build-workspace-image.sh
        env:
          LIBGUESTFS_BACKEND: direct
      - name: Sign disk image and manifest
        env:
          COSIGN_YES: 'true'
        run: |
          dist/workspace-image/cosign sign-blob --bundle dist/workspace-image/ai-native-paas-workspace.raw.xz.sigstore.json dist/workspace-image/ai-native-paas-workspace.raw.xz
          dist/workspace-image/cosign sign-blob --bundle dist/workspace-image/manifest.sigstore.json dist/workspace-image/manifest.json
          rm dist/workspace-image/cosign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: workspace-vm-${{ github.sha }}
          path: dist/workspace-image/
          if-no-files-found: error
          retention-days: 14
