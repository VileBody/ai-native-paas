name: commercial-governance

on:
  push:
    paths:
      - '**.go'
      - 'go.mod'
      - 'Makefile'
      - 'migrations/commerce/**'
      - 'scripts/verify-iteration-6*'
      - 'scripts/commerce-api-smoke.sh'
      - '.github/workflows/iteration-6-ci.yml'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: make fmt-check vet test tdd-iteration6
      - run: make race-commerce
      - run: make fuzz-commerce FUZZTIME=10s
      - run: make build smoke-commerce-api
      - run: |
          go test -count=1 -covermode=atomic \
            -coverpkg=./internal/commerce/...,./pkg/contracts/commerce/v1 \
            -coverprofile=coverage-commerce.out \
            ./internal/commerce/... ./pkg/contracts/commerce/v1 ./test/acceptance ./test/contract
          go tool cover -html=coverage-commerce.out -o coverage-commerce.html
      - uses: actions/upload-artifact@v4
        with:
          name: iteration-6-commerce-coverage
          path: coverage-commerce.html

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_POSTGRES_DSN: host=127.0.0.1 port=5432 user=postgres password=postgres dbname=paas_test sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev pkg-config
      - run: make test-commerce-postgres
