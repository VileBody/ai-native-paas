apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hello-go
  namespace: hello-go-smoke
  labels:
    app.kubernetes.io/name: hello-go
    ai-native-paas.io/runtime-smoke: hello-go
spec:
  parentRefs:
    - name: runtime
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - hello-go.5.42.126.95.nip.io
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - group: ""
          kind: Service
          name: hello-go
          port: 80
          weight: 1
