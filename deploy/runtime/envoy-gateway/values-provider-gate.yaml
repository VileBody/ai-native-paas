global:
  images:
    envoyGateway:
      image: docker.io/envoyproxy/gateway@sha256:6b86fcef4f012fff1edc452db891ae6d09757e385305c73f5022c32550258d26
      pullPolicy: IfNotPresent
crds:
  enabled: true
deployment:
  replicas: 2
  envoyGateway:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
  pod:
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                control-plane: envoy-gateway
            topologyKey: kubernetes.io/hostname
service:
  type: ClusterIP
podDisruptionBudget:
  minAvailable: 1
hpa:
  enabled: false
