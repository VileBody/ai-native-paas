apiVersion: v1
kind: ResourceQuota
metadata:
  name: runtime-sim-budget
  namespace: paas-runtime-sim
  labels:
    ai-native-paas.io/runtime-driver: runtime_sim_k8s
    ai-native-paas.io/evidence-class: dev-product
    ai-native-paas.io/not-cozystack-live: "true"
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "20"
    persistentvolumeclaims: "8"
    requests.storage: 40Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: runtime-sim-defaults
  namespace: paas-runtime-sim
  labels:
    ai-native-paas.io/runtime-driver: runtime_sim_k8s
    ai-native-paas.io/evidence-class: dev-product
    ai-native-paas.io/not-cozystack-live: "true"
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 512Mi
