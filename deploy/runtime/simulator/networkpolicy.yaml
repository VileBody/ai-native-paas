apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-sim-default-deny
  namespace: paas-runtime-sim
  labels:
    ai-native-paas.io/runtime-driver: runtime_sim_k8s
    ai-native-paas.io/evidence-class: dev-product
    ai-native-paas.io/not-cozystack-live: "true"
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: runtime-sim-allow-namespace-and-dns
  namespace: paas-runtime-sim
  labels:
    ai-native-paas.io/runtime-driver: runtime_sim_k8s
    ai-native-paas.io/evidence-class: dev-product
    ai-native-paas.io/not-cozystack-live: "true"
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector: {}
  egress:
    - to:
        - podSelector: {}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
