apiVersion: batch/v1
kind: Job
metadata:
  name: iteration-5-postgres-tests
  namespace: ai-native-paas-user-test
  labels:
    ai-native-paas.io/owner: verification
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iteration-5-postgres-tests
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: craas-ai-native-paas-registry
      containers:
        - name: tests
          image: ai-native-paas-registry.registry.twcstorage.ru/ai-native-paas-tests:iteration-5
          imagePullPolicy: Always
          command: ["/bin/bash", "-ec"]
          args:
            - >-
              export TEST_POSTGRES_DSN="host=user-postgres port=5432 user=postgres
              password=${POSTGRES_PASSWORD} dbname=paas_test sslmode=disable";
              make test-postgres
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
