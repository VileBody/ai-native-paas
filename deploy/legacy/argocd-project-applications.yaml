apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: legacy-quarantine
  namespace: legacy-argocd
spec:
  description: Operator-owned legacy apps excluded from the AI-native PaaS runtime.
  sourceRepos:
    - https://github.com/VileBody/rec-sidecar-mvp.git
  destinations:
    - namespace: rec-sidecar
      server: https://kubernetes.default.svc
    - namespace: botamin-voice
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceBlacklist:
    - group: rbac.authorization.k8s.io
      kind: RoleBinding
    - group: rbac.authorization.k8s.io
      kind: Role
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rec-sidecar
  namespace: legacy-argocd
  labels:
    ai-native-paas.io/scope: legacy-quarantine
spec:
  project: legacy-quarantine
  source:
    repoURL: https://github.com/VileBody/rec-sidecar-mvp.git
    targetRevision: b20a5923541205a50dcabfeb661f67ada3e9f979
    path: k8s/minimal-rec
  destination:
    server: https://kubernetes.default.svc
    namespace: rec-sidecar
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: botamin-voice
  namespace: legacy-argocd
  labels:
    ai-native-paas.io/scope: legacy-quarantine
spec:
  project: legacy-quarantine
  source:
    repoURL: https://github.com/VileBody/rec-sidecar-mvp.git
    targetRevision: b20a5923541205a50dcabfeb661f67ada3e9f979
    path: k8s/botamin-voice
  destination:
    server: https://kubernetes.default.svc
    namespace: botamin-voice
  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PruneLast=true
