apiVersion: v1
kind: ConfigMap
metadata:
  name: klukhanova-static-nginx
  namespace: rec-sidecar
  labels:
    ai-native-paas.io/scope: legacy-quarantine
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;
      charset utf-8;

      location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
      }

      location ~* \.(?:css|js|mjs|jpg|jpeg|png|gif|svg|webp|avif|ico|mp4|webm|mov|woff|woff2|ttf|otf)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000" always;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: klukhanova-static
  namespace: rec-sidecar
  labels:
    ai-native-paas.io/scope: legacy-quarantine
spec:
  selector:
    app.kubernetes.io/name: klukhanova-static
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klukhanova-static
  namespace: rec-sidecar
  labels:
    app.kubernetes.io/name: klukhanova-static
    ai-native-paas.io/scope: legacy-quarantine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: klukhanova-static
  template:
    metadata:
      labels:
        app.kubernetes.io/name: klukhanova-static
        ai-native-paas.io/scope: legacy-quarantine
    spec:
      nodeSelector:
        ai-native-paas.io/pool: ci
      imagePullSecrets:
        - name: craas-ai-native-paas-registry
      containers:
        - name: nginx
          image: ai-native-paas-registry.registry.twcstorage.ru/mirror/legacy/nginx@sha256:62223d644fa234c3a1cc785ee14242ec47a77364226f1c811d2f669f96dc2ac8
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 300m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: site
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: site
          persistentVolumeClaim:
            claimName: klukhanova-site
        - name: nginx-conf
          configMap:
            name: klukhanova-static-nginx
---
